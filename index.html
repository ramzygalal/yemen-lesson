<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدرس التفاعلي - الصف الثالث الابتدائي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .author {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .card {
            background: #e8f4fd;
            border: 2px dashed #3498db;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .letter {
            font-size: 70px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 15px;
        }
        .word {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
            transition: 0.3s;
        }
        button:active {
            transform: scale(0.95);
        }
        button.stop {
            background-color: #c0392b;
            box-shadow: 0 4px 10px rgba(192, 57, 43, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>الدرس التعليمي التفاعلي</h1>
        <div class="author">إعداد: رمزي أبو ساجد</div>

        <div class="card">
            <div class="letter">بَـا</div>
            <div class="word">بَـابـُـمْ</div>
            <!-- زر التبديل للتشغيل والإيقاف -->
            <button id="speakBtn" onclick="toggleSpeech()">🔊 استمع للطق</button>
        </div>
    </div>

    <script>
        const textToSpeech = "بـَا بَـابـُـمْ.. حُرُوفُ الهِجَاءِ بِمَدٍ واضِحٍ وَبُطْءٍ لِلطلابِ الصِّغَارِ";
        const btn = document.getElementById('speakBtn');
        let utterance = null;

        function toggleSpeech() {
            if (!('speechSynthesis' in window)) {
                alert('عذراً، متصفحك لا يدعم نطق الصوت.');
                return;
            }

            // إذا كان الصوت ينطق حالياً، نقوم بإيقافه
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
                resetButton();
                return;
            }

            // إذا لم يكن ينطق، نبدأ النطق
            utterance = new SpeechSynthesisUtterance(textToSpeech);
            utterance.lang = 'ar-SA'; // ضبط اللغة العربية بدقة لهواتف الجوال
            utterance.rate = 0.75;    // بطء الصوت قليلاً ليكون مناسباً لطلاب الثالث ابتدائي والوضوح
            utterance.pitch = 1.1;    // طبقة صوت مفعمة بالحيوية

            // عندما ينتهي الصوت تلقائياً يعود شكل الزر لطبيعته
            utterance.onend = function() {
                resetButton();
            };

            utterance.onerror = function() {
                resetButton();
            };

            // تغيير شكل الزر إلى حالة الإيقاف
            btn.textContent = "⏹️ إيقاف الصوت";
            btn.className = "stop";

            speechSynthesis.speak(utterance);
        }

        function resetButton() {
            if (btn) {
                btn.textContent = "🔊 استمع للنطق";
                btn.className = "";
            }
        }
    </script>

</body>
</html>
